<!doctype html>
<!-- @dsCard group="Spacing" name="Corner Radii" subtitle="xs → 2xl + pill" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 24px;">
  <div class="label-small" style="margin-bottom:12px;">Corner Radii</div>
  <div style="display:flex; gap:14px; align-items:flex-end;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:4px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">xs · 4</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:8px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">sm · 8</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:12px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">md · 12</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:16px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">lg · 16</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:24px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">xl · 24</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:32px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">2xl · 32</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
      <div style="width:72px; height:72px; background:var(--blue-100); border:2px solid var(--blue-500); border-radius:999px;"></div>
      <div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">pill</div>
    </div>
  </div>
</div>
</body></html>
