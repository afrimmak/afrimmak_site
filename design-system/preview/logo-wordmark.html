<!doctype html>
<!-- @dsCard group="Brand" name="Logo · Wordmark On Color" subtitle="On paper, blue, ink, and green surfaces" viewport="700x320" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="display:grid; grid-template-columns: 1fr 1fr; gap:14px; padding:20px;">
  <div style="background:var(--paper); border:1px solid var(--border-1); border-radius:14px; padding:18px; height:130px; display:flex; align-items:center; justify-content:center;">
    <img src="../assets/afrimmak-wordmark.png" style="max-width:100%; max-height:100%;" alt="Wordmark only">
  </div>
  <div style="background:var(--blue-500); border-radius:14px; padding:18px; height:130px; display:flex; align-items:center; justify-content:center;">
    <div style="font-family:var(--font-display); font-weight:900; font-size:36px; letter-spacing:-0.02em; color:white;">
      AFRi<span style="color:var(--green-300)">MMAK</span>
    </div>
  </div>
  <div style="background:var(--ink-900); border-radius:14px; padding:18px; height:130px; display:flex; align-items:center; justify-content:center;">
    <div style="font-family:var(--font-display); font-weight:900; font-size:36px; letter-spacing:-0.02em;">
      <span style="color:white">AFRi</span><span style="color:var(--afr-green)">MMAK</span>
    </div>
  </div>
  <div style="background:var(--green-500); border-radius:14px; padding:18px; height:130px; display:flex; align-items:center; justify-content:center;">
    <div style="font-family:var(--font-display); font-weight:900; font-size:36px; letter-spacing:-0.02em; color:white;">
      AFRiMMAK
    </div>
  </div>
</div>
</body></html>
