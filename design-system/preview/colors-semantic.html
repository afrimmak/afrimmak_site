<!doctype html>
<!-- @dsCard group="Colors" name="Semantic Colors" subtitle="Success · Warning · Danger · Info" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 20px;">
  <div class="label-small" style="margin-bottom:12px;">Semantic Colors</div>
  <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
    <div style="border-radius:12px; border:1px solid var(--border-1); overflow:hidden;">
      <div style="background:var(--bg-success-soft); padding:10px 12px;">
        <div style="font-family:var(--font-display); font-weight:700; color:var(--green-700); font-size:13px;">Success</div>
        <div style="font-size:11px; color:var(--green-700); font-family:var(--font-mono);">--color-success</div>
      </div>
      <div style="background:var(--color-success); padding:10px 12px; color:white; font-family:var(--font-mono); font-size:11px;">#5AA722</div>
    </div>
    <div style="border-radius:12px; border:1px solid var(--border-1); overflow:hidden;">
      <div style="background:#FFF6E5; padding:10px 12px;">
        <div style="font-family:var(--font-display); font-weight:700; color:#8A5A00; font-size:13px;">Warning</div>
        <div style="font-size:11px; color:#8A5A00; font-family:var(--font-mono);">--color-warning</div>
      </div>
      <div style="background:#E89B12; padding:10px 12px; color:white; font-family:var(--font-mono); font-size:11px;">#E89B12</div>
    </div>
    <div style="border-radius:12px; border:1px solid var(--border-1); overflow:hidden;">
      <div style="background:var(--bg-danger-soft); padding:10px 12px;">
        <div style="font-family:var(--font-display); font-weight:700; color:var(--red-700); font-size:13px;">Danger</div>
        <div style="font-size:11px; color:var(--red-700); font-family:var(--font-mono);">--color-danger</div>
      </div>
      <div style="background:var(--color-danger); padding:10px 12px; color:white; font-family:var(--font-mono); font-size:11px;">#EE2A30</div>
    </div>
    <div style="border-radius:12px; border:1px solid var(--border-1); overflow:hidden;">
      <div style="background:var(--bg-brand-soft); padding:10px 12px;">
        <div style="font-family:var(--font-display); font-weight:700; color:var(--blue-700); font-size:13px;">Info</div>
        <div style="font-size:11px; color:var(--blue-700); font-family:var(--font-mono);">--color-info</div>
      </div>
      <div style="background:var(--color-info); padding:10px 12px; color:white; font-family:var(--font-mono); font-size:11px;">#0048A8</div>
    </div>
  </div>
</div>
</body></html>
