<!doctype html>
<!-- @dsCard group="Components" name="Cards" subtitle="Default · Feature · Pop" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:20px 24px;">
  <div class="label-small" style="margin-bottom:14px;">Cards</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px;">
    <!-- default -->
    <div style="background:white; border:1px solid var(--ink-100); border-radius:16px; padding:16px; box-shadow: 0 2px 6px rgba(10,26,51,0.08);">
      <div style="font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--blue-600); margin-bottom:6px;">Fellowship</div>
      <div style="font-family:var(--font-display); font-weight:800; font-size:18px; line-height:1.2; color:var(--ink-900); margin-bottom:6px;">Spark Fellowship</div>
      <div style="font-family:var(--font-body); font-size:12px; color:var(--ink-700); line-height:1.5;">Six months. One idea. A continent of mentors.</div>
    </div>
    <!-- feature -->
    <div style="background:white; border:2px solid var(--blue-500); border-radius:24px; padding:16px;">
      <div style="font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--blue-600); margin-bottom:6px;">Featured</div>
      <div style="font-family:var(--font-display); font-weight:800; font-size:18px; line-height:1.2; color:var(--ink-900); margin-bottom:6px;">Builder Grant</div>
      <div style="font-family:var(--font-body); font-size:12px; color:var(--ink-700); line-height:1.5;">Up to $5,000 to ship your first thing.</div>
    </div>
    <!-- pop -->
    <div style="background:var(--blue-500); color:white; border-radius:32px; padding:18px; box-shadow:0 12px 32px rgba(0,72,168,0.28);">
      <div style="font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--green-300); margin-bottom:6px;">Apply →</div>
      <div style="font-family:var(--font-display); font-weight:900; font-size:22px; line-height:1.05; margin-bottom:6px;">Cohort '25 is open</div>
      <div style="font-family:var(--font-body); font-size:12px; opacity:0.85; line-height:1.5;">Applications close Aug 30.</div>
    </div>
  </div>
</div>
</body></html>
