<!doctype html>
<!-- @dsCard group="Components" name="Badges & Chips" subtitle="Solid + soft badges; filter chips" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:20px 24px;">
  <div class="label-small" style="margin-bottom:14px;">Badges &amp; Chips</div>
  <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
    <span style="background:var(--blue-500); color:white; padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.04em; text-transform:uppercase;">Cohort '25</span>
    <span style="background:var(--green-500); color:white; padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.04em; text-transform:uppercase;">Open</span>
    <span style="background:var(--red-500); color:white; padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.04em; text-transform:uppercase;">New</span>
    <span style="background:var(--blue-50); color:var(--blue-700); padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Fellowship</span>
    <span style="background:var(--green-50); color:var(--green-700); padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Active</span>
    <span style="background:var(--red-50); color:var(--red-700); padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Closing soon</span>
    <span style="background:var(--ink-50); color:var(--ink-700); padding:4px 12px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Draft</span>
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px;">
    <span style="border:1.5px solid var(--ink-200); padding:6px 14px; border-radius:999px; font-family:var(--font-body); font-size:13px; color:var(--ink-700);">Lagos</span>
    <span style="border:1.5px solid var(--blue-500); background:var(--blue-50); padding:6px 14px; border-radius:999px; font-family:var(--font-body); font-weight:600; font-size:13px; color:var(--blue-700);">Nairobi ×</span>
    <span style="border:1.5px solid var(--ink-200); padding:6px 14px; border-radius:999px; font-family:var(--font-body); font-size:13px; color:var(--ink-700);">Accra</span>
    <span style="border:1.5px solid var(--ink-200); padding:6px 14px; border-radius:999px; font-family:var(--font-body); font-size:13px; color:var(--ink-700);">Kigali</span>
    <span style="border:1.5px solid var(--ink-200); padding:6px 14px; border-radius:999px; font-family:var(--font-body); font-size:13px; color:var(--ink-700);">Remote</span>
  </div>
</div>
</body></html>
