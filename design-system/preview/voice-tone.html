<!doctype html>
<!-- @dsCard group="Brand" name="Voice & Tone" subtitle="Do / don't + voice attributes" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:20px 24px;">
  <div class="label-small" style="margin-bottom:12px;">Voice &amp; Tone</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
    <div style="border:1.5px solid var(--green-500); background:var(--green-50); border-radius:12px; padding:12px 14px;">
      <div style="font-family:var(--font-display); font-weight:800; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--green-700); margin-bottom:6px;">✓ Do</div>
      <div style="font-family:var(--font-body); font-size:13px; color:var(--ink-900); line-height:1.45;">"We back young African builders. Apply, build, ship."</div>
    </div>
    <div style="border:1.5px solid var(--red-500); background:var(--red-50); border-radius:12px; padding:12px 14px;">
      <div style="font-family:var(--font-display); font-weight:800; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:var(--red-700); margin-bottom:6px;">✗ Don't</div>
      <div style="font-family:var(--font-body); font-size:13px; color:var(--ink-900); line-height:1.45;">"We provide capacity‑building solutions to youth stakeholders."</div>
    </div>
  </div>
  <div style="margin-top:12px; display:flex; flex-wrap:wrap; gap:6px;">
    <span style="background:var(--blue-50); color:var(--blue-700); padding:3px 10px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Optimistic</span>
    <span style="background:var(--blue-50); color:var(--blue-700); padding:3px 10px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Direct</span>
    <span style="background:var(--blue-50); color:var(--blue-700); padding:3px 10px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">People‑first</span>
    <span style="background:var(--blue-50); color:var(--blue-700); padding:3px 10px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">Verb‑led</span>
    <span style="background:var(--blue-50); color:var(--blue-700); padding:3px 10px; border-radius:999px; font-family:var(--font-display); font-weight:700; font-size:11px;">No jargon</span>
  </div>
</div>
</body></html>
