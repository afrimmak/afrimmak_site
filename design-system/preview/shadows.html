<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation · Shadows" subtitle="Soft navy-tinted, plus brand glow" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:24px; background:var(--ink-50);">
  <div class="label-small" style="margin-bottom:16px;">Elevation</div>
  <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:14px;">
    <div style="background:white; height:78px; border-radius:12px; box-shadow: 0 1px 2px rgba(10,26,51,0.06); display:flex; align-items:flex-end; padding:8px; font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">xs</div>
    <div style="background:white; height:78px; border-radius:12px; box-shadow: 0 2px 6px rgba(10,26,51,0.08); display:flex; align-items:flex-end; padding:8px; font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">sm</div>
    <div style="background:white; height:78px; border-radius:12px; box-shadow: 0 8px 20px rgba(10,26,51,0.10); display:flex; align-items:flex-end; padding:8px; font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">md</div>
    <div style="background:white; height:78px; border-radius:12px; box-shadow: 0 16px 40px rgba(10,26,51,0.14); display:flex; align-items:flex-end; padding:8px; font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">lg</div>
    <div style="background:var(--blue-500); height:78px; border-radius:12px; box-shadow: 0 12px 32px rgba(0,72,168,0.28); display:flex; align-items:flex-end; padding:8px; font-family:var(--font-mono); font-size:10px; color:rgba(255,255,255,0.8);">brand</div>
  </div>
</div>
</body></html>
