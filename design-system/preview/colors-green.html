<!doctype html>
<!-- @dsCard group="Colors" name="Green Scale" subtitle="Secondary — 50→900" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 20px;">
  <div class="label-small" style="margin-bottom:10px;">Green · Secondary</div>
  <div style="display:grid; grid-template-columns: repeat(10, 1fr); gap:6px;">
    
    <div class="swatch" style="background:#F1FBE6; height:90px; color:var(--ink-900)">
      <div class="name">50</div>
      <div class="hex">#F1FBE6</div>
    </div>
    <div class="swatch" style="background:#DEF4C2; height:90px; color:var(--ink-900)">
      <div class="name">100</div>
      <div class="hex">#DEF4C2</div>
    </div>
    <div class="swatch" style="background:#C0E993; height:90px; color:var(--ink-900)">
      <div class="name">200</div>
      <div class="hex">#C0E993</div>
    </div>
    <div class="swatch" style="background:#A1DD64; height:90px; color:var(--ink-900)">
      <div class="name">300</div>
      <div class="hex">#A1DD64</div>
    </div>
    <div class="swatch" style="background:#88D247; height:90px; color:var(--ink-900)">
      <div class="name">400</div>
      <div class="hex">#88D247</div>
    </div>
    <div class="swatch" style="background:#6FC52E; height:90px; ">
      <div class="name">500</div>
      <div class="hex">#6FC52E</div>
    </div>
    <div class="swatch" style="background:#5AA722; height:90px; ">
      <div class="name">600</div>
      <div class="hex">#5AA722</div>
    </div>
    <div class="swatch" style="background:#45851A; height:90px; ">
      <div class="name">700</div>
      <div class="hex">#45851A</div>
    </div>
    <div class="swatch" style="background:#316213; height:90px; ">
      <div class="name">800</div>
      <div class="hex">#316213</div>
    </div>
    <div class="swatch" style="background:#1F400B; height:90px; ">
      <div class="name">900</div>
      <div class="hex">#1F400B</div>
    </div>
  </div>
</div>
</body></html>
