<!doctype html>
<!-- @dsCard group="Components" name="Top Navigation" subtitle="Logo + links + CTA" viewport="700x90" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:0; background:white;">
  <!-- Marketing nav -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--ink-100);">
    <div style="display:flex; align-items:center; gap:24px;">
      <div style="font-family:var(--font-display); font-weight:900; font-size:18px; letter-spacing:-0.01em;">
        <span style="color:var(--afr-blue)">AFRi</span><span style="color:var(--afr-green)">MMAK</span>
      </div>
      <div style="display:flex; gap:18px; font-family:var(--font-body); font-size:13px; font-weight:500; color:var(--ink-700);">
        <span style="color:var(--blue-600); font-weight:600; position:relative;">Programs<span style="position:absolute; left:0; right:0; bottom:-18px; height:2px; background:var(--blue-500); border-radius:2px;"></span></span>
        <span>Impact</span>
        <span>Stories</span>
        <span>About</span>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button style="background:transparent; border:none; font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--ink-700); cursor:pointer;">Sign in</button>
      <button style="background:var(--blue-500); color:white; border:none; border-radius:999px; padding:8px 16px; font-family:var(--font-display); font-weight:700; font-size:13px; cursor:pointer;">Apply now</button>
    </div>
  </div>
</div>
</body></html>
