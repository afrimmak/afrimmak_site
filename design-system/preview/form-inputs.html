<!doctype html>
<!-- @dsCard group="Components" name="Form Inputs" subtitle="Inputs, selects, checkbox, radio" viewport="700x240" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<style>
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-family:var(--font-display); font-weight:700; font-size:11px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-700); }
  .input, .select { font-family:var(--font-body); font-size:14px; padding:11px 14px; border:1.5px solid var(--ink-200); border-radius:12px; background:white; color:var(--ink-900); outline:none; transition:all 160ms var(--ease-out); }
  .input:focus, .select:focus { border-color:var(--blue-500); box-shadow: 0 0 0 4px rgba(0,72,168,0.15); }
  .input::placeholder { color:var(--ink-300); }
</style>
</head>
<body>
<div class="card" style="padding:20px 24px;">
  <div class="label-small" style="margin-bottom:14px;">Form Inputs</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:14px;">
    <div class="field"><label>Full name</label><input class="input" value="Amaka Okafor"></div>
    <div class="field"><label>Email</label><input class="input" placeholder="you@example.com"></div>
    <div class="field"><label>Country</label><select class="select"><option>Nigeria</option><option>Kenya</option><option>Ghana</option></select></div>
    <div class="field"><label>Program</label><input class="input" placeholder="Spark Fellowship" style="border-color:var(--blue-500); box-shadow:0 0 0 4px rgba(0,72,168,0.15);"></div>
  </div>
  <div style="display:flex; align-items:center; gap:14px; margin-top:14px;">
    <label style="display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-size:14px; color:var(--ink-700);"><input type="checkbox" checked style="width:18px; height:18px; accent-color:var(--blue-500);"> I agree to the terms</label>
    <label style="display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-size:14px; color:var(--ink-700);"><input type="radio" name="r" checked style="width:18px; height:18px; accent-color:var(--blue-500);"> 6‑month track</label>
    <label style="display:inline-flex; align-items:center; gap:8px; font-family:var(--font-body); font-size:14px; color:var(--ink-700);"><input type="radio" name="r" style="width:18px; height:18px; accent-color:var(--blue-500);"> 12‑month track</label>
  </div>
</div>
</body></html>
