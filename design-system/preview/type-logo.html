<!doctype html>
<!-- @dsCard group="Type" name="Logo Font · Ethnocentric" subtitle="Logo wordmark only — never for UI or body" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:22px 24px;">
  <div class="label-small" style="margin-bottom:8px;">Logo Font · Ethnocentric</div>
  <div style="display:flex; align-items:center; gap:18px;">
    <div style="background:white; border:1px solid var(--border-1); border-radius:14px; padding:14px 18px; display:inline-flex; align-items:center;">
      <span style="font-family:var(--font-logo); font-weight:400; font-size:24px; letter-spacing:0.02em; text-transform:uppercase;">
        <span style="color:var(--afr-blue)">AFRi</span><span style="color:var(--afr-green)">MMAK</span>
      </span>
    </div>
    <div style="font-family:var(--font-body); font-size:13px; color:var(--ink-700); line-height:1.45; max-width:340px;">
      Used <strong>only</strong> for the inline wordmark when an image isn't possible. Never for headings, body, or UI.
    </div>
  </div>
  <div style="display:flex; gap:14px; margin-top:14px; font-family:var(--font-mono); font-size:11px; color:var(--ink-500);">
    <span>Ethnocentric · Regular (400)</span>
    <span>fonts/Ethnocentric-Regular.otf</span>
  </div>
</div>
</body></html>
