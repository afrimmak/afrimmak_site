<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 8pt Grid" subtitle="Tokens 1 → 20 (4 → 80px)" viewport="700x180" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 24px;">
  <div class="label-small" style="margin-bottom:12px;">Spacing · 8pt grid</div>
  <div style="display:flex; align-items:flex-end; gap:10px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:4px; height:4px; background:var(--blue-500); border-radius:2px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">1·4</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:8px; height:8px; background:var(--blue-500); border-radius:2px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">2·8</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:12px; height:12px; background:var(--blue-500); border-radius:2px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">3·12</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:16px; height:16px; background:var(--blue-500); border-radius:3px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">4·16</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:24px; height:24px; background:var(--blue-500); border-radius:4px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">6·24</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:32px; height:32px; background:var(--blue-500); border-radius:4px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">8·32</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:48px; height:48px; background:var(--blue-500); border-radius:6px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">12·48</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:64px; height:64px; background:var(--blue-500); border-radius:6px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">16·64</div></div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px;"><div style="width:80px; height:80px; background:var(--blue-500); border-radius:8px;"></div><div style="font-family:var(--font-mono); font-size:10px; color:var(--ink-500);">20·80</div></div>
  </div>
</div>
</body></html>
