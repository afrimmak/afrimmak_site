<!doctype html>
<!-- @dsCard group="Brand" name="Icons · Lucide Set" subtitle="1.75px stroke; emoji avoided" viewport="700x230" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  .ic { width:28px; height:28px; color:var(--ink-700); stroke-width:1.75; }
  .ic-tile { display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 6px; border-radius:10px; }
  .ic-label { font-family:var(--font-mono); font-size:10px; color:var(--ink-500); }
</style>
</head>
<body>
<div class="card" style="padding:18px 24px;">
  <div class="label-small" style="margin-bottom:12px;">Icons · Lucide (1.75px stroke)</div>
  <div style="display:grid; grid-template-columns: repeat(8, 1fr); gap:4px;">
    <div class="ic-tile"><i data-lucide="lightbulb" class="ic" style="color:var(--red-500)"></i><div class="ic-label">spark</div></div>
    <div class="ic-tile"><i data-lucide="graduation-cap" class="ic"></i><div class="ic-label">learn</div></div>
    <div class="ic-tile"><i data-lucide="users" class="ic"></i><div class="ic-label">cohort</div></div>
    <div class="ic-tile"><i data-lucide="rocket" class="ic" style="color:var(--blue-500)"></i><div class="ic-label">ship</div></div>
    <div class="ic-tile"><i data-lucide="heart-handshake" class="ic" style="color:var(--green-600)"></i><div class="ic-label">back</div></div>
    <div class="ic-tile"><i data-lucide="map-pin" class="ic"></i><div class="ic-label">place</div></div>
    <div class="ic-tile"><i data-lucide="calendar" class="ic"></i><div class="ic-label">date</div></div>
    <div class="ic-tile"><i data-lucide="award" class="ic"></i><div class="ic-label">grant</div></div>
    <div class="ic-tile"><i data-lucide="book-open" class="ic"></i><div class="ic-label">read</div></div>
    <div class="ic-tile"><i data-lucide="message-circle" class="ic"></i><div class="ic-label">talk</div></div>
    <div class="ic-tile"><i data-lucide="globe-2" class="ic"></i><div class="ic-label">world</div></div>
    <div class="ic-tile"><i data-lucide="arrow-right" class="ic"></i><div class="ic-label">next</div></div>
    <div class="ic-tile"><i data-lucide="check-circle-2" class="ic" style="color:var(--green-600)"></i><div class="ic-label">done</div></div>
    <div class="ic-tile"><i data-lucide="bell" class="ic"></i><div class="ic-label">alert</div></div>
    <div class="ic-tile"><i data-lucide="search" class="ic"></i><div class="ic-label">find</div></div>
    <div class="ic-tile"><i data-lucide="user" class="ic"></i><div class="ic-label">user</div></div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body></html>
