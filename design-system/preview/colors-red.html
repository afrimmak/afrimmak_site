<!doctype html>
<!-- @dsCard group="Colors" name="Red Scale" subtitle="Accent — 50→900" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 20px;">
  <div class="label-small" style="margin-bottom:10px;">Red · Accent</div>
  <div style="display:grid; grid-template-columns: repeat(10, 1fr); gap:6px;">
    
    <div class="swatch" style="background:#FDE7E8; height:90px; color:var(--ink-900)">
      <div class="name">50</div>
      <div class="hex">#FDE7E8</div>
    </div>
    <div class="swatch" style="background:#F9BFC1; height:90px; color:var(--ink-900)">
      <div class="name">100</div>
      <div class="hex">#F9BFC1</div>
    </div>
    <div class="swatch" style="background:#F4878B; height:90px; color:var(--ink-900)">
      <div class="name">200</div>
      <div class="hex">#F4878B</div>
    </div>
    <div class="swatch" style="background:#F15359; height:90px; ">
      <div class="name">300</div>
      <div class="hex">#F15359</div>
    </div>
    <div class="swatch" style="background:#EF3A40; height:90px; ">
      <div class="name">400</div>
      <div class="hex">#EF3A40</div>
    </div>
    <div class="swatch" style="background:#EE2A30; height:90px; ">
      <div class="name">500</div>
      <div class="hex">#EE2A30</div>
    </div>
    <div class="swatch" style="background:#C81F25; height:90px; ">
      <div class="name">600</div>
      <div class="hex">#C81F25</div>
    </div>
    <div class="swatch" style="background:#9F181D; height:90px; ">
      <div class="name">700</div>
      <div class="hex">#9F181D</div>
    </div>
    <div class="swatch" style="background:#761115; height:90px; ">
      <div class="name">800</div>
      <div class="hex">#761115</div>
    </div>
    <div class="swatch" style="background:#4D0A0D; height:90px; ">
      <div class="name">900</div>
      <div class="hex">#4D0A0D</div>
    </div>
  </div>
</div>
</body></html>
