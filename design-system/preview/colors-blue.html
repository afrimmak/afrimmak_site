<!doctype html>
<!-- @dsCard group="Colors" name="Blue Scale" subtitle="Primary — 50→900" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 20px;">
  <div class="label-small" style="margin-bottom:10px;">Blue · Primary</div>
  <div style="display:grid; grid-template-columns: repeat(10, 1fr); gap:6px;">
    
    <div class="swatch" style="background:#EAF1FB; height:90px; color:var(--ink-900)">
      <div class="name">50</div>
      <div class="hex">#EAF1FB</div>
    </div>
    <div class="swatch" style="background:#C9DCF3; height:90px; color:var(--ink-900)">
      <div class="name">100</div>
      <div class="hex">#C9DCF3</div>
    </div>
    <div class="swatch" style="background:#94B7E5; height:90px; color:var(--ink-900)">
      <div class="name">200</div>
      <div class="hex">#94B7E5</div>
    </div>
    <div class="swatch" style="background:#5E92D7; height:90px; ">
      <div class="name">300</div>
      <div class="hex">#5E92D7</div>
    </div>
    <div class="swatch" style="background:#2D6FC4; height:90px; ">
      <div class="name">400</div>
      <div class="hex">#2D6FC4</div>
    </div>
    <div class="swatch" style="background:#0048A8; height:90px; ">
      <div class="name">500</div>
      <div class="hex">#0048A8</div>
    </div>
    <div class="swatch" style="background:#003A8A; height:90px; ">
      <div class="name">600</div>
      <div class="hex">#003A8A</div>
    </div>
    <div class="swatch" style="background:#002E6E; height:90px; ">
      <div class="name">700</div>
      <div class="hex">#002E6E</div>
    </div>
    <div class="swatch" style="background:#002253; height:90px; ">
      <div class="name">800</div>
      <div class="hex">#002253</div>
    </div>
    <div class="swatch" style="background:#001637; height:90px; ">
      <div class="name">900</div>
      <div class="hex">#001637</div>
    </div>
  </div>
</div>
</body></html>
