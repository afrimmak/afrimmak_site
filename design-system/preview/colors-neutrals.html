<!doctype html>
<!-- @dsCard group="Colors" name="Neutrals" subtitle="Ink + paper scale" viewport="700x170" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="padding:18px 20px;">
  <div class="label-small" style="margin-bottom:10px;">Neutrals · Ink + Paper</div>
  <div style="display:grid; grid-template-columns: repeat(9, 1fr); gap:6px;">
    
    <div class="swatch" style="background:#FFFFFF; height:90px; color:var(--ink-900)">
      <div class="name">Paper</div>
      <div class="hex">#FFFFFF</div>
    </div>
    <div class="swatch" style="background:#FBFAF6; height:90px; color:var(--ink-900)">
      <div class="name">Warm</div>
      <div class="hex">#FBFAF6</div>
    </div>
    <div class="swatch" style="background:#F4F6F9; height:90px; color:var(--ink-900)">
      <div class="name">50</div>
      <div class="hex">#F4F6F9</div>
    </div>
    <div class="swatch" style="background:#E5E7EC; height:90px; color:var(--ink-900)">
      <div class="name">100</div>
      <div class="hex">#E5E7EC</div>
    </div>
    <div class="swatch" style="background:#C5CAD3; height:90px; color:var(--ink-900)">
      <div class="name">200</div>
      <div class="hex">#C5CAD3</div>
    </div>
    <div class="swatch" style="background:#98A0AE; height:90px; color:var(--ink-900)">
      <div class="name">300</div>
      <div class="hex">#98A0AE</div>
    </div>
    <div class="swatch" style="background:#5A6577; height:90px; ">
      <div class="name">500</div>
      <div class="hex">#5A6577</div>
    </div>
    <div class="swatch" style="background:#2A3852; height:90px; ">
      <div class="name">700</div>
      <div class="hex">#2A3852</div>
    </div>
    <div class="swatch" style="background:#0A1A33; height:90px; ">
      <div class="name">900</div>
      <div class="hex">#0A1A33</div>
    </div>
  </div>
</div>
</body></html>
