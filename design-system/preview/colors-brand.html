<!doctype html>
<!-- @dsCard group="Colors" name="Brand Colors" subtitle="Blue · Green · Red · Ink" viewport="700x200" -->
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"></head>
<body>
<div class="card" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:12px; padding:20px;">
  <div class="swatch" style="background:var(--afr-blue); height:130px;">
    <div class="name">Afrimmak Blue</div>
    <div class="hex">#0048A8</div>
  </div>
  <div class="swatch" style="background:var(--afr-green); height:130px;">
    <div class="name">Afrimmak Green</div>
    <div class="hex">#6FC52E</div>
  </div>
  <div class="swatch" style="background:var(--afr-red); height:130px;">
    <div class="name">Afrimmak Red</div>
    <div class="hex">#EE2A30</div>
  </div>
  <div class="swatch" style="background:var(--afr-ink); height:130px;">
    <div class="name">Ink</div>
    <div class="hex">#0A1A33</div>
  </div>
</div>
</body></html>
