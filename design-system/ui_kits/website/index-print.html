<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Afrimmak — Skills, mentorship, and a real shot for young Gambians</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="site.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

    @page { size: letter; margin: 0; }

    @media print {
      html, body { margin: 0; }
      body { padding: 0.5in 0.6in; background: #fff; }

      /* Un-stick the nav so it flows with the page instead of overlapping. */
      nav[style*="fixed"], nav[style*="sticky"] { position: static !important; }

      /* Neutralise the hero's top padding that was clearing the fixed nav. */
      header { padding-top: 48px !important; }

      /* Static flow, no clipping, no hover chrome. */
      * { overflow: visible !important; }

      /* Keep composed units whole across page breaks. */
      h1, h2, h3, .h1, .h2, .h3, .h-display { break-after: avoid; }
      .card, figure, table, .stat, [class*="stat"] { break-inside: avoid; }
      p { orphans: 3; widows: 3; }

      /* Freeze animations at their end state. */
      *, *::before, *::after {
        animation-delay: -99s !important; animation-duration: .001s !important;
        animation-iteration-count: 1 !important; animation-fill-mode: both !important;
        animation-play-state: running !important; transition-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Placeholder.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Hero.jsx"></script>
  <script type="text/babel" src="Progress.jsx"></script>
  <script type="text/babel" src="Programs.jsx"></script>
  <script type="text/babel" src="Testimonials.jsx"></script>
  <script type="text/babel" src="ApplyCTA.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="ApplyOverlay.jsx"></script>
  <script type="text/babel" src="DonateOverlay.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    function Home() {
      const learn = () => {};

      React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

      return (
        <div data-screen-label="01 Home">
          <Nav onDonate={() => {}} current="Home" />
          <Hero onApply={() => {}} onLearn={learn} />
          <Progress />
          <Programs />
          <Testimonials />
          <PartnerStrip />
          <ApplyCTA onApply={() => {}} onLearn={learn} />
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Home />);
  </script>

  <script>
    addEventListener('load', () => {
      (async () => {
        // Wait for React to mount the content.
        const start = Date.now();
        while (!document.querySelector('[data-screen-label]') && Date.now() - start < 8000) {
          await new Promise((r) => setTimeout(r, 100));
        }
        try { await document.fonts.ready; } catch (e) {}
        const imgs = Array.from(document.images).filter((i) => !i.complete);
        await Promise.race([
          Promise.allSettled(imgs.map((i) => i.decode())),
          new Promise((r) => setTimeout(r, 8000)),
        ]);
        setTimeout(() => window.print(), 600);
      })();
    });
  </script>
</body>
</html>
