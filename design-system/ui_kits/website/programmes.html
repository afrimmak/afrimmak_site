<!doctype html>
<!-- @dsCard group="UI Kit — Website" name="Website · Programmes" subtitle="3 programme cards, application steps, FAQ" viewport="1280x900" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Programmes · Afrimmak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="site.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Placeholder.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="ApplyOverlay.jsx"></script>
  <script type="text/babel" src="DonateOverlay.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    const PROGRAMMES = [
      {
        id: 'skills', tag: 'Programme 01', title: 'Youth Skills Training', tone: 'var(--afr-blue)',
        status: 'Pilot cohort enrolling', icon: 'wrench',
        for: 'Young Gambians, 16–24, living in The Gambia',
        duration: '8 weeks · in-person, Greater Banjul',
        gain: 'Certificate, toolkit, mentor pair-up',
        keyDates: 'Applications close 30 June · Cohort starts 1 August',
      },
      {
        id: 'ent', tag: 'Programme 02', title: 'Entrepreneurship Bootcamp', tone: 'var(--green-600)',
        status: 'Curriculum in development', icon: 'rocket',
        for: 'Aspiring founders, 18–28, in The Gambia',
        duration: '6 weeks · blended (in-person + online)',
        gain: 'Curriculum, mentor, pitch event, seed support for top ideas',
        keyDates: 'Intake dates TBC',
      },
      {
        id: 'mentor', tag: 'Programme 03', title: 'Mentorship Network', tone: 'var(--afr-red)',
        status: 'Mentors being onboarded', icon: 'heart-handshake',
        for: 'Programme alumni + invited youth (all ages 16–28)',
        duration: 'Ongoing · monthly check-ins',
        gain: '1:1 and small-group mentorship, peer cohort, opportunities',
        keyDates: 'Rolling enrolment',
      },
    ];

    function Programmes() {
      const [apply, setApply] = React.useState(false);
      return (
        <PageShell current="Programmes">
          <PageBanner
            eyebrow="Our Programmes"
            title={<>Short, practical, made for<br/><span style={{ color: 'var(--afr-blue)' }}>young Gambians.</span></>}
            intro="Every programme is hands-on, built for The Gambia, and runs with local partners. Pick the one that fits where you are right now — you can always switch, or do more than one."
          />

          <section>
            <div className="afr-container" style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
              {PROGRAMMES.map((p, i) => (
                <article key={p.id} style={{
                  background: 'white',
                  border: '1px solid var(--ink-100)',
                  borderRadius: 24, overflow: 'hidden',
                  boxShadow: '0 2px 6px rgba(10,26,51,0.06)',
                  display: 'grid', gridTemplateColumns: '1fr 1.4fr',
                }}>
                  {/* Programme photo placeholder */}
                  <div style={{ minHeight: 320, position: 'relative' }}>
                    <Placeholder kind="Photo"
                      label={`Photo — ${p.title}`}
                      hint="Real photo of the activity or participants. No stock."
                      height="100%" />
                  </div>
                  <div style={{ padding: '32px 36px', display: 'flex', flexDirection: 'column', gap: 14 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: 6,
                        background: `${p.tone}14`, color: p.tone,
                        padding: '6px 12px', borderRadius: 999,
                        fontFamily: 'var(--font-display)', fontWeight: 800,
                        fontSize: 11, letterSpacing: '0.06em', textTransform: 'uppercase',
                      }}>
                        <i data-lucide={p.icon} style={{ width: 14, height: 14 }}></i>
                        {p.tag}
                      </span>
                      <span style={{
                        display: 'inline-flex', alignItems: 'center', gap: 6,
                        background: 'rgba(232,155,18,0.14)', color: '#8A5A00',
                        padding: '6px 12px', borderRadius: 999,
                        fontFamily: 'var(--font-display)', fontWeight: 800,
                        fontSize: 10, letterSpacing: '0.06em', textTransform: 'uppercase',
                      }}>
                        <span style={{ width: 5, height: 5, borderRadius: 3, background: '#E89B12' }} />
                        {p.status}
                      </span>
                    </div>
                    <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 36, letterSpacing: '-0.02em', margin: 0, color: 'var(--ink-900)' }}>{p.title}</h2>
                    <Placeholder kind="Content"
                      label="Programme description — 2 to 4 sentences"
                      hint="What it is · what participants learn · what they gain. Plain language, no jargon."
                      height={84} />
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                      <FactRow icon="users" label="Who it's for" value={p.for} />
                      <FactRow icon="calendar" label="Duration & format" value={p.duration} />
                      <FactRow icon="gift" label="You receive" value={p.gain} />
                      <FactRow icon="alarm-clock" label="Key dates" value={p.keyDates} />
                    </div>
                    <div style={{ display: 'flex', gap: 10, marginTop: 8 }}>
                      <button className="btn btn-primary" onClick={() => setApply(true)}>
                        Apply
                        <i data-lucide="arrow-right" className="icon"></i>
                      </button>
                      <button className="btn btn-ghost">Read full details</button>
                    </div>
                  </div>
                </article>
              ))}
            </div>
          </section>

          {/* Application process */}
          <section style={{ background: 'var(--paper-warm)' }}>
            <div className="afr-container">
              <div style={{ textAlign: 'center', marginBottom: 40 }}>
                <div className="eyebrow" style={{ marginBottom: 12 }}>How to Apply</div>
                <h2 className="h2" style={{ margin: 0 }}>Four steps — about 10 minutes.</h2>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 18 }}>
                {[
                  { n: '01', t: 'Submit',  d: 'Fill in a short form. Phone or email is fine.' },
                  { n: '02', t: 'Chat',    d: 'A quick WhatsApp or in-person conversation.' },
                  { n: '03', t: 'Confirm', d: 'We tell you whether you\'re in within 14 days.' },
                  { n: '04', t: 'Start',   d: 'Show up to your cohort. We handle the rest.' },
                ].map(s => (
                  <div key={s.n} className="card" style={{ padding: 24 }}>
                    <div style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 36, color: 'var(--blue-200)', letterSpacing: '-0.02em', lineHeight: 1 }}>{s.n}</div>
                    <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 18, marginTop: 12, color: 'var(--ink-900)' }}>{s.t}</div>
                    <div style={{ fontFamily: 'var(--font-body)', fontSize: 14, lineHeight: 1.55, marginTop: 6, color: 'var(--ink-700)' }}>{s.d}</div>
                  </div>
                ))}
              </div>
              <div style={{ textAlign: 'center', marginTop: 36 }}>
                <button className="btn btn-primary btn-lg" onClick={() => setApply(true)}>
                  Start application
                  <i data-lucide="arrow-right" className="icon"></i>
                </button>
              </div>
            </div>
          </section>

          {/* FAQ */}
          <section>
            <div className="afr-container" style={{ maxWidth: 820 }}>
              <div style={{ marginBottom: 28 }}>
                <div className="eyebrow" style={{ marginBottom: 12 }}>FAQs</div>
                <h2 className="h2" style={{ margin: 0 }}>Common questions.</h2>
              </div>
              <FAQ />
            </div>
          </section>

          <ApplyOverlay open={apply} onClose={() => setApply(false)} />
        </PageShell>
      );
    }

    function FactRow({ icon, label, value }) {
      return (
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <i data-lucide={icon} style={{ width: 18, height: 18, color: 'var(--blue-600)', marginTop: 2, flex: '0 0 18px' }}></i>
          <div>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--ink-700)' }}>{label}</div>
            <div style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--ink-900)', marginTop: 2 }}>{value}</div>
          </div>
        </div>
      );
    }

    function FAQ() {
      const qs = [
        { q: 'Do I have to be from The Gambia?', a: 'For now, yes — all programmes run in The Gambia and are open to young people living there. We may open up to wider West Africa in future cohorts.' },
        { q: 'How much does it cost?', a: 'Programmes are free for accepted participants. Where partners cover transport or materials, we\'ll let you know up front.' },
        { q: 'Do I need a laptop or experience?', a: 'No. We\'ll tell you what to bring before each cohort. The Skills Training is open to anyone — no prior experience needed.' },
        { q: 'Can I apply for more than one programme?', a: 'Yes. Pick the one that fits best now; we can talk about others on your intake call.' },
        { q: 'I missed the deadline. What now?', a: 'Apply anyway. We\'ll add you to the next intake list and message you when the next cohort opens.' },
      ];
      const [open, setOpen] = React.useState(0);
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {qs.map((it, i) => (
            <div key={i} style={{
              border: '1px solid var(--ink-100)',
              borderRadius: 16,
              background: open === i ? 'var(--paper-warm)' : 'white',
              transition: 'background 180ms',
            }}>
              <button onClick={() => setOpen(open === i ? -1 : i)} style={{
                width: '100%', textAlign: 'left',
                background: 'transparent', border: 'none', cursor: 'pointer',
                padding: '18px 24px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16,
                fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 17, color: 'var(--ink-900)',
                letterSpacing: '-0.01em',
              }}>
                {it.q}
                <i data-lucide={open === i ? 'minus' : 'plus'} style={{ width: 20, height: 20, color: 'var(--blue-500)' }}></i>
              </button>
              {open === i && (
                <div style={{ padding: '0 24px 22px', fontFamily: 'var(--font-body)', fontSize: 15, lineHeight: 1.6, color: 'var(--ink-700)' }}>
                  {it.a}
                </div>
              )}
            </div>
          ))}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Programmes />);
  </script>
</body>
</html>
