<!doctype html>
<!-- @dsCard group="UI Kit — Website" name="Website · Contact" subtitle="Form + WhatsApp + enquiry-typed addresses" viewport="1280x900" -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact · Afrimmak</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="site.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Placeholder.jsx"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="ApplyOverlay.jsx"></script>
  <script type="text/babel" src="DonateOverlay.jsx"></script>
  <script type="text/babel" src="PageShell.jsx"></script>

  <script type="text/babel">
    function Contact() {
      const [enquiry, setEnquiry] = React.useState('Programmes');
      const [sent, setSent] = React.useState(false);

      const SocialIcon = ({ name }) => {
        const common = { width: 18, height: 18, viewBox: '0 0 24 24', fill: 'currentColor' };
        if (name === 'WhatsApp') return (<svg {...common}><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.92c0 1.75.46 3.45 1.33 4.96L2 22l5.27-1.38a9.96 9.96 0 0 0 4.77 1.21h.01c5.46 0 9.91-4.45 9.91-9.91A9.85 9.85 0 0 0 12.04 2zm5.79 14.05c-.24.68-1.42 1.3-1.97 1.34-.5.04-1.13.06-1.83-.11-.42-.1-.96-.27-1.66-.57-2.92-1.26-4.83-4.21-4.97-4.4-.15-.19-1.19-1.58-1.19-3.02 0-1.44.76-2.14 1.03-2.44.27-.3.6-.37.8-.37.2 0 .4 0 .57.01.18.01.43-.07.67.51.24.58.83 2.02.9 2.16.07.15.12.32.02.51-.1.19-.15.31-.3.48-.15.17-.32.39-.45.52-.15.15-.31.31-.13.61.18.3.79 1.31 1.7 2.12 1.17 1.04 2.16 1.37 2.46 1.52.3.15.48.13.66-.08.18-.21.76-.89.96-1.2.2-.3.4-.25.67-.15.27.1 1.71.81 2 .96.3.15.5.22.57.34.07.13.07.73-.17 1.41z"/></svg>);
        if (name === 'Instagram') return (<svg {...common} fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>);
        if (name === 'Facebook') return (<svg {...common}><path d="M13 22V12h3l.5-4H13V5.5c0-1.1.3-1.9 2-1.9h2.1V.2C16.8.1 15.6 0 14.2 0 11.2 0 9 1.8 9 5.2V8H6v4h3v10h4z"/></svg>);
        return null;
      };

      return (
        <PageShell current="Contact">
          <PageBanner
            eyebrow="Contact"
            title={<>Let's talk.</>}
            intro="We're a small team and we read everything. Send a note, drop us a WhatsApp, or come find us — whichever works for you."
            accent="var(--afr-blue)" />

          <section>
            <div className="afr-container" style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 32, alignItems: 'start' }}>
              {/* Form */}
              <div className="card" style={{ padding: 36 }}>
                <h2 style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 30, letterSpacing: '-0.02em', margin: 0, color: 'var(--ink-900)' }}>
                  Send us a message
                </h2>
                <p style={{ fontFamily: 'var(--font-body)', fontSize: 15, lineHeight: 1.55, color: 'var(--ink-700)', marginTop: 8, marginBottom: 20 }}>
                  We'll get back to you within two working days.
                </p>

                {sent ? (
                  <div style={{ background: 'var(--green-50)', border: '1px solid var(--green-500)', borderRadius: 16, padding: 24, display: 'flex', gap: 14, alignItems: 'flex-start' }}>
                    <i data-lucide="check-circle-2" style={{ width: 28, height: 28, color: 'var(--green-600)', flex: '0 0 28px' }}></i>
                    <div>
                      <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 18, color: 'var(--ink-900)' }}>Thanks — we got it.</div>
                      <div style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--ink-700)', marginTop: 4 }}>We'll be in touch within two working days. If it's urgent, message us on WhatsApp.</div>
                    </div>
                  </div>
                ) : (
                  <form onSubmit={e => { e.preventDefault(); setSent(true); }} style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                    {/* Enquiry type */}
                    <div>
                      <label style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--ink-700)', marginBottom: 8, display: 'block' }}>What's it about?</label>
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                        {['Programmes','Partnerships','Media','Volunteer','Other'].map(o => (
                          <button key={o} type="button" onClick={() => setEnquiry(o)} style={{
                            padding: '8px 16px',
                            border: enquiry === o ? '2px solid var(--blue-500)' : '1.5px solid var(--ink-200)',
                            background: enquiry === o ? 'var(--blue-50)' : 'white',
                            color: enquiry === o ? 'var(--blue-700)' : 'var(--ink-700)',
                            borderRadius: 999, cursor: 'pointer',
                            fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: 13,
                          }}>{o}</button>
                        ))}
                      </div>
                    </div>
                    <CField label="Your name" placeholder="Aisha Jallow" />
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 14 }}>
                      <CField label="Email" placeholder="you@example.com" />
                      <CField label="Phone (WhatsApp)" placeholder="+220 …" />
                    </div>
                    <CTextArea label="Your message" placeholder="A few sentences in your own words." />
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 14, marginTop: 8 }}>
                      <span style={{ fontFamily: 'var(--font-body)', fontSize: 12, color: 'var(--ink-500)' }}>
                        We'll only use these details to reply to you.
                      </span>
                      <button type="submit" className="btn btn-primary btn-lg">
                        Send message
                        <i data-lucide="arrow-right" className="icon"></i>
                      </button>
                    </div>
                  </form>
                )}
              </div>

              {/* Sidebar */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div style={{ background: 'var(--green-500)', borderRadius: 20, padding: 28, color: 'white' }}>
                  <div className="eyebrow on-dark" style={{ marginBottom: 8, color: 'rgba(255,255,255,0.85)' }}>Fastest way</div>
                  <div style={{ fontFamily: 'var(--font-display)', fontWeight: 900, fontSize: 26, letterSpacing: '-0.02em' }}>Message us on WhatsApp.</div>
                  <div style={{ fontFamily: 'var(--font-body)', fontSize: 14, marginTop: 8, opacity: 0.95 }}>Mon–Fri, 9:00 to 17:00 GMT.</div>
                  <a href="#" className="btn btn-lg" style={{ background: 'white', color: 'var(--green-700)', marginTop: 16 }}>
                    <SocialIcon name="WhatsApp" />
                    Open WhatsApp
                  </a>
                </div>

                <div className="card" style={{ padding: 24 }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                    <ContactLine icon="mail"    label="Email"          value="hello@afrimmak.org" placeholder={false} />
                    <ContactLine icon="map-pin" label="Where we are"   value="The Gambia · address coming soon" placeholder />
                    <ContactLine icon="clock"   label="Office hours"   value="Mon–Fri · 9:00–17:00 GMT" placeholder />
                  </div>
                </div>

                <div className="card" style={{ padding: 24 }}>
                  <div className="eyebrow" style={{ marginBottom: 10 }}>By enquiry type</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8, fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--ink-700)' }}>
                    <div><strong style={{ color: 'var(--ink-900)' }}>Programmes:</strong> hello@afrimmak.org</div>
                    <div><strong style={{ color: 'var(--ink-900)' }}>Partnerships:</strong> partners@afrimmak.org</div>
                    <div><strong style={{ color: 'var(--ink-900)' }}>Media:</strong> press@afrimmak.org</div>
                  </div>
                  <div style={{ marginTop: 12, fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-500)' }}>Addresses are placeholders — confirm with MIF.</div>
                </div>

                <div className="card" style={{ padding: 24 }}>
                  <div className="eyebrow" style={{ marginBottom: 12 }}>Follow along</div>
                  <div style={{ display: 'flex', gap: 10 }}>
                    {[
                      { name: 'WhatsApp', tone: '#25D366' },
                      { name: 'Instagram', tone: '#E1306C' },
                      { name: 'Facebook', tone: '#1877F2' },
                    ].map(s => (
                      <a key={s.name} href="#" aria-label={s.name} style={{
                        width: 44, height: 44, borderRadius: 999, background: s.tone, color: 'white',
                        display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                      }}>
                        <SocialIcon name={s.name} />
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>
        </PageShell>
      );
    }

    function CField({ label, placeholder }) {
      return (
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--ink-700)' }}>{label}</span>
          <input placeholder={placeholder}
            style={{ fontFamily: 'var(--font-body)', fontSize: 14, padding: '11px 14px', border: '1.5px solid var(--ink-200)', borderRadius: 12, outline: 'none' }}
            onFocus={e => { e.target.style.borderColor = 'var(--blue-500)'; e.target.style.boxShadow = '0 0 0 4px rgba(0,72,168,0.15)'; }}
            onBlur={e => { e.target.style.borderColor = 'var(--ink-200)'; e.target.style.boxShadow = 'none'; }}
          />
        </label>
      );
    }
    function CTextArea({ label, placeholder }) {
      return (
        <label style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--ink-700)' }}>{label}</span>
          <textarea placeholder={placeholder} rows={5}
            style={{ fontFamily: 'var(--font-body)', fontSize: 14, padding: '11px 14px', border: '1.5px solid var(--ink-200)', borderRadius: 12, outline: 'none', resize: 'vertical' }}
          />
        </label>
      );
    }
    function ContactLine({ icon, label, value, placeholder }) {
      return (
        <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: 'var(--blue-50)', color: 'var(--blue-700)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: '0 0 36px' }}>
            <i data-lucide={icon} style={{ width: 18, height: 18 }}></i>
          </div>
          <div>
            <div style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 11, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--ink-700)' }}>{label}</div>
            <div style={{ fontFamily: 'var(--font-body)', fontSize: 14, color: 'var(--ink-900)', marginTop: 2 }}>
              {value}
              {placeholder && <DraftTag>Pending</DraftTag>}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Contact />);
  </script>
</body>
</html>
